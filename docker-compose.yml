version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urban_ai_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-urban_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-urban_ai_db}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: urban_ai_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_ai_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-urban_admin}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-urban_ai_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  pgdata:
  redisdata:
