version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urban_ai_db
    restart: always
    environment:
      POSTGRES_USER: urban_admin
      POSTGRES_PASSWORD: urban_password
      POSTGRES_DB: urban_ai_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: urban_ai_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: urban_ai_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://urban_admin:urban_password@postgres:5432/urban_ai_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  pgdata:
  redisdata:
